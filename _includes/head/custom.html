<!-- Content Security Policy (CSP) -->
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self' 'unsafe-inline' https://kit.fontawesome.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://use.fontawesome.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://use.fontawesome.com https://cdn.jsdelivr.net; img-src 'self' data: https://*; connect-src 'self' https://*; frame-src 'self' https://*;">

<!-- Dark mode: áp dụng theme trước khi render để tránh FOUC -->
<script>
  (function () {
    try {
      var theme = localStorage.getItem('theme') || 'light';
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) { }
  })();
</script>

<!-- Custom CSS (dark mode styles) -->
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">

<!-- Favicon -->
<link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">

<!-- Dark mode JS -->
<script src="{{ '/assets/js/dark-mode.js' | relative_url }}" defer></script>
