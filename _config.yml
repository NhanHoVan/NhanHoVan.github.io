# ==========================================
# Theme
# ==========================================
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "default"

# ==========================================
# Site Info
# ==========================================
title: "Van Nhan"
title_separator: "-"
subtitle: "Personal Blog & Portfolio"
description: "Trang web cá nhân và blog chia sẻ kiến thức của Hồ  Văn Nhân - Full-stack Developer tại Đà Nẵng. Nơi chia sẻ các dự án, bài viết công nghệ và trải nghiệm lập trình."
locale: "vi"
url: "https://nhanhovan.github.io"
baseurl: ""

# ==========================================
# Build
# ==========================================
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
timezone: Asia/Ho_Chi_Minh

# ==========================================
# Global Reading Settings
# ==========================================
read_time: true
related: false
comments:
  provider: false

# ==========================================
# Author
# ==========================================
author:
  name: "Hồ Văn Nhân"
  avatar: /assets/images/avatar.png
  bio: "Java Developer / Full-stack Developer · 5+ năm kinh nghiệm"
  location: "Đà Nẵng, Việt Nam"
  email: "nhanhv.qt@gmail.com"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/NhanHoVan"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/nhan-ho-van-50a027181/"
    - label: "YouTube"
      icon: "fab fa-fw fa-youtube"
      url: "https://www.youtube.com/@lakhongmau"
    - label: "Facebook"
      icon: "fab fa-fw fa-facebook"
      url: "https://www.facebook.com/nhan.hovan.587"

# ==========================================
# Include _pages directory
# ==========================================
include:
  - _pages

# ==========================================
# Collections
# ==========================================
collections:
  projects:
    output: true
    permalink: /projects/:slug/

# ==========================================
# Defaults
# ==========================================
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      related: false
      show_date: true
      share: false
      comments: false
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# ==========================================
# Plugins
# ==========================================
plugins:
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache
  - jekyll-remote-theme


# ==========================================
# Paginate
# ==========================================
paginate: 10
paginate_path: /articles/page:num/

# ==========================================
# External RSS Feeds
# ==========================================
rss_feeds:
  - "https://feeds.arstechnica.com/arstechnica/index"
  - "https://techcrunch.com/feed/"
  - "https://feed.infoq.com/"
  - "https://github.blog/feed/"
  - "https://news.ycombinator.com/rss"
  - "https://openai.com/news/rss.xml"
  - "https://blog.cloudflare.com/rss/"
  - "https://krebsonsecurity.com/feed/"
